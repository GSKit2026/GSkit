<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="AIML Students Scientific Calculator - GSKit">
<title>AIML Students Scientific Calculator | GSKit</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#07111f,#101b2d,#07111f);
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:18px 8px;
}

.calculator{
    width:100%;
    max-width:650px;
    background:#151a22;
    border:1px solid #354052;
    border-radius:22px;
    padding:15px;
    box-shadow:0 20px 60px rgba(0,0,0,.55);
}

.header{
    text-align:center;
    margin-bottom:12px;
}

.brand{
    font-size:12px;
    color:#63b3ff;
    font-weight:bold;
    letter-spacing:2px;
}

.title{
    font-size:20px;
    font-weight:800;
    margin-top:4px;
}

.screen{
    background:#a9bd99;
    color:#102010;
    min-height:125px;
    border-radius:12px;
    padding:10px 14px;
    margin:10px 0 13px;
    border:5px solid #242a32;
    box-shadow:inset 0 0 15px rgba(0,0,0,.35);
    overflow:hidden;
}

.status{
    height:22px;
    display:flex;
    gap:13px;
    font-size:11px;
    font-weight:bold;
}

.expression{
    height:38px;
    font-size:20px;
    text-align:right;
    white-space:nowrap;
    overflow-x:auto;
}

.answer{
    height:42px;
    font-size:31px;
    font-weight:bold;
    text-align:right;
    white-space:nowrap;
    overflow-x:auto;
}

.top-controls{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:6px;
    margin-bottom:7px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:7px;
}

button{
    min-height:47px;
    border:0;
    border-radius:9px;
    background:#303844;
    color:#fff;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 3px 0 #161b22;
    transition:.08s;
    user-select:none;
}

button:active{
    transform:translateY(3px);
    box-shadow:none;
}

.control{
    min-height:39px;
    font-size:11px;
    background:#242b35;
}

.func{background:#394352}
.number{background:#252c35;font-size:18px}
.operator{background:#45556a;font-size:20px}
.equal{background:#1677d2;font-size:22px}
.danger{background:#9c3030}
.special{background:#5b4730}

.footer{
    text-align:center;
    margin-top:13px;
    color:#7e8998;
    font-size:11px;
}

.popup{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
    justify-content:center;
    align-items:center;
    padding:20px;
    z-index:99;
}

.popup.show{display:flex}

.popup-box{
    width:100%;
    max-width:340px;
    background:#1d232c;
    border:1px solid #485364;
    border-radius:16px;
    padding:18px;
}

.popup-box h3{
    margin-bottom:13px;
}

.popup-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
}

@media(max-width:450px){
    .calculator{
        padding:9px;
        border-radius:15px;
    }

    .title{font-size:16px}
    .answer{font-size:26px}
    .expression{font-size:17px}

    button{
        min-height:43px;
        font-size:12px;
    }

    .number{font-size:16px}
}
</style>
</head>

<body>

<div class="calculator">

<div class="header">
    <div class="brand">GSKIT • STUDENT TOOLS</div>
    <div class="title">AIML Students Scientific Calculator</div>
</div>

<div class="screen">

    <div class="status">
        <span id="angleDisplay">DEG</span>
        <span id="shiftText">SHIFT OFF</span>
        <span id="alphaText">ALPHA OFF</span>
        <span id="memoryDisplay"></span>
    </div>

    <div id="expression" class="expression"></div>
    <div id="answer" class="answer">0</div>

</div>

<div class="top-controls">

<button class="control" onclick="toggleShift()">SHIFT</button>
<button class="control" onclick="toggleAlpha()">ALPHA</button>
<button class="control" onclick="showAngle()">DRG</button>
<button class="control" onclick="showMenu()">MENU</button>
<button class="control" onclick="showSetup()">SETUP</button>
<button class="control" onclick="powerOn()">ON</button>

</div>

<div class="grid">

<button class="func" onclick="memoryClear()">MC</button>
<button class="func" onclick="memoryRecall()">MR</button>
<button class="func" onclick="memoryPlus()">M+</button>
<button class="func" onclick="memoryMinus()">M−</button>
<button class="func" onclick="memoryStore()">MS</button>
<button class="danger" onclick="allClear()">AC</button>

<button class="func" onclick="sinFunction()">sin</button>
<button class="func" onclick="cosFunction()">cos</button>
<button class="func" onclick="tanFunction()">tan</button>
<button class="func" onclick="inverseTrig()">sin⁻¹</button>
<button class="func" onclick="inverseCos()">cos⁻¹</button>
<button class="func" onclick="inverseTan()">tan⁻¹</button>

<button class="func" onclick="logFunction()">log</button>
<button class="func" onclick="lnFunction()">ln</button>
<button class="func" onclick="sqrtFunction()">√</button>
<button class="func" onclick="square()">x²</button>
<button class="func" onclick="cube()">x³</button>
<button class="func" onclick="powerFunction()">xʸ</button>

<button class="func" onclick="factorial()">x!</button>
<button class="func" onclick="reciprocal()">1/x</button>
<button class="func" onclick="percentFunction()">%</button>
<button class="func" onclick="insert('π')">π</button>
<button class="func" onclick="insert('e')">e</button>
<button class="func" onclick="randomFunction()">Ran#</button>

<button class="special" onclick="insert('(')">(</button>
<button class="special" onclick="insert(')')">)</button>
<button class="special" onclick="insert('Ans')">Ans</button>
<button class="special" onclick="nCr()">nCr</button>
<button class="special" onclick="fraction()">a/b</button>
<button class="special" onclick="scientificNotation()">×10ˣ</button>

<button class="number" onclick="insert('7')">7</button>
<button class="number" onclick="insert('8')">8</button>
<button class="number" onclick="insert('9')">9</button>
<button class="operator" onclick="insert('÷')">÷</button>
<button class="operator" onclick="insert('^')">^</button>
<button class="danger" onclick="deleteLast()">DEL</button>

<button class="number" onclick="insert('4')">4</button>
<button class="number" onclick="insert('5')">5</button>
<button class="number" onclick="insert('6')">6</button>
<button class="operator" onclick="insert('×')">×</button>
<button class="operator" onclick="insert('%')">%</button>
<button class="operator" onclick="negative()">±</button>

<button class="number" onclick="insert('1')">1</button>
<button class="number" onclick="insert('2')">2</button>
<button class="number" onclick="insert('3')">3</button>
<button class="operator" onclick="insert('+')">+</button>
<button class="operator" onclick="insert('−')">−</button>
<button class="equal" onclick="calculate()">=</button>

<button class="number" onclick="insert('0')">0</button>
<button class="number" onclick="insert('.')">.</button>
<button class="func" onclick="absoluteFunction()">|x|</button>
<button class="func" onclick="expFunction()">EXP</button>
<button class="func" onclick="showHistory()">HIST</button>
<button class="func" onclick="insert('e')">EXP</button>

</div>

<div class="footer">
    GSKit • AIML Students Scientific Calculator
</div>

</div>


<!-- POPUP -->

<div id="popup" class="popup">
<div class="popup-box">

<h3 id="popupTitle">MENU</h3>

<div class="popup-grid">

<button onclick="setAngle('DEG')">DEG</button>
<button onclick="setAngle('RAD')">RAD</button>
<button onclick="setAngle('GRAD')">GRAD</button>

<button onclick="matrixMode()">MATRIX</button>
<button onclick="vectorMode()">VECTOR</button>
<button onclick="statMode()">STAT</button>

<button onclick="complexMode()">CMPLX</button>
<button onclick="baseMode()">BASE</button>
<button onclick="constantMenu()">CONST</button>

</div>

<br>

<button style="width:100%" onclick="closePopup()">CLOSE</button>

</div>
</div>


<script>

/* =========================================
   GSKit SCIENTIFIC CALCULATOR ENGINE
========================================= */

let expression = "";
let answer = 0;
let memory = 0;
let storedValue = 0;

let angleMode = "DEG";
let shift = false;
let alpha = false;

let history = [];
let historyPosition = -1;


/* SCREEN */

function update(){

    document.getElementById("expression").textContent =
        expression;

    document.getElementById("answer").textContent =
        format(answer);

    document.getElementById("angleDisplay").textContent =
        angleMode;

    document.getElementById("shiftText").textContent =
        "SHIFT " + (shift ? "ON" : "OFF");

    document.getElementById("alphaText").textContent =
        "ALPHA " + (alpha ? "ON" : "OFF");

    document.getElementById("memoryDisplay").textContent =
        memory !== 0 ? "M" : "";
}


/* INSERT */

function insert(value){
    expression += value;
    update();
}


/* CLEAR */

function allClear(){
    expression = "";
    answer = 0;
    update();
}


function deleteLast(){
    expression =
        expression.substring(0, expression.length - 1);

    update();
}


/* ANGLE */

function toRad(x){

    if(angleMode === "DEG")
        return x * Math.PI / 180;

    if(angleMode === "GRAD")
        return x * Math.PI / 200;

    return x;
}


function fromRad(x){

    if(angleMode === "DEG")
        return x * 180 / Math.PI;

    if(angleMode === "GRAD")
        return x * 200 / Math.PI;

    return x;
}


/* =========================================
   SAFE EXPRESSION CALCULATOR
========================================= */

function calculateExpression(text){

    let s = text;

    s = s.replace(/×/g,"*");
    s = s.replace(/÷/g,"/");
    s = s.replace(/−/g,"-");

    s = s.replace(/π/g,"PI");
    s = s.replace(/\bAns\b/g,"ANS");

    s = s.replace(/\^/g,"**");

    s = s.replace(/(\d+(?:\.\d+)?)%/g,"($1/100)");

    s = s.replace(/sin\(/g,"SIN(");
    s = s.replace(/cos\(/g,"COS(");
    s = s.replace(/tan\(/g,"TAN(");

    s = s.replace(/log\(/g,"LOG(");
    s = s.replace(/ln\(/g,"LN(");

    s = s.replace(/sqrt\(/g,"SQRT(");
    s = s.replace(/abs\(/g,"ABS(");
    s = s.replace(/exp\(/g,"EXP(");

    /*
      e constant only when used alone.
      Example: 2×e
    */
    s = s.replace(/\be\b/g,"E");

    try{

        /*
          Allow only calculator characters.
        */

        if(!/^[0-9+\-*/().,%A-Z_ ]+$/.test(s)){
            throw new Error("Invalid");
        }

        let result = Function(
            "PI","E","ANS",
            "SIN","COS","TAN",
            "ASIN","ACOS","ATAN",
            "LOG","LN","SQRT",
            "ABS","EXP",
            '"use strict"; return (' + s + ')'
        )(
            Math.PI,
            Math.E,
            answer,

            x => Math.sin(toRad(x)),
            x => Math.cos(toRad(x)),
            x => Math.tan(toRad(x)),

            x => fromRad(Math.asin(x)),
            x => fromRad(Math.acos(x)),
            x => fromRad(Math.atan(x)),

            x => Math.log10(x),
            x => Math.log(x),
            x => Math.sqrt(x),
            x => Math.abs(x),
            x => Math.exp(x)
        );

        if(!Number.isFinite(result))
            throw new Error("Math Error");

        return result;

    }catch(e){

        throw new Error("Invalid Calculation");
    }
}


/* CALCULATE */

function calculate(){

    if(!expression.trim())
        return;

    try{

        let old = expression;

        let result =
            calculateExpression(expression);

        history.push(old);

        historyPosition = history.length;

        answer = result;
        expression = "";

        update();

    }catch(e){

        showError();
    }
}


/* CURRENT VALUE */

function currentValue(){

    if(expression.trim()){

        try{
            return calculateExpression(expression);
        }catch(e){
            showError();
            return null;
        }
    }

    return answer;
}


/* POWER */

function square(){

    let x = currentValue();

    if(x === null) return;

    answer = x*x;
    expression = "";

    update();
}


function cube(){

    let x = currentValue();

    if(x === null) return;

    answer = x*x*x;
    expression = "";

    update();
}


function powerFunction(){

    if(expression.trim()){
        insert("^");
        return;
    }

    let x = answer;

    let p = Number(prompt("Power"));

    if(!Number.isFinite(p)) return;

    answer = Math.pow(x,p);
    update();
}


/* ROOT */

function sqrtFunction(){

    let x = currentValue();

    if(x === null || x < 0){
        showError();
        return;
    }

    answer = Math.sqrt(x);
    expression = "";

    update();
}


/* LOG */

function logFunction(){

    let x = currentValue();

    if(x === null || x <= 0){
        showError();
        return;
    }

    answer = Math.log10(x);
    expression = "";

    update();
}


function lnFunction(){

    let x = currentValue();

    if(x === null || x <= 0){
        showError();
        return;
    }

    answer = Math.log(x);
    expression = "";

    update();
}


function expFunction(){

    let x = currentValue();

    if(x === null) return;

    answer = Math.exp(x);
    expression = "";

    update();
}


/* TRIG */

function sinFunction(){

    let x = currentValue();

    if(x === null) return;

    answer = Math.sin(toRad(x));
    expression = "";

    update();
}


function cosFunction(){

    let x = currentValue();

    if(x === null) return;

    answer = Math.cos(toRad(x));
    expression = "";

    update();
}


function tanFunction(){

    let x = currentValue();

    if(x === null) return;

    answer = Math.tan(toRad(x));
    expression = "";

    update();
}


/* INVERSE TRIG */

function inverseTrig(){

    let x = currentValue();

    if(x === null || x < -1 || x > 1){
        showError();
        return;
    }

    answer = fromRad(Math.asin(x));
    expression = "";

    update();
}


function inverseCos(){

    let x = currentValue();

    if(x === null || x < -1 || x > 1){
        showError();
        return;
    }

    answer = fromRad(Math.acos(x));
    expression = "";

    update();
}


function inverseTan(){

    let x = currentValue();

    if(x === null) return;

    answer = fromRad(Math.atan(x));
    expression = "";

    update();
}


/* NEGATIVE */

function negative(){

    let x = currentValue();

    if(x === null) return;

    answer = -x;
    expression = "";

    update();
}


/* FACTORIAL */

function factorial(){

    let x = currentValue();

    if(
        x === null ||
        x < 0 ||
        !Number.isInteger(x) ||
        x > 170
    ){
        showError();
        return;
    }

    let result = 1;

    for(let i=2;i<=x;i++)
        result *= i;

    answer = result;
    expression = "";

    update();
}


/* nCr */

function nCr(){

    let n = Number(prompt("Enter n"));
    let r = Number(prompt("Enter r"));

    if(
        !Number.isInteger(n) ||
        !Number.isInteger(r) ||
        n < 0 ||
        r < 0 ||
        r > n
    ){
        showError();
        return;
    }

    answer =
        factorialNumber(n) /
        (
            factorialNumber(r) *
            factorialNumber(n-r)
        );

    expression = "";

    update();
}


function factorialNumber(n){

    let result = 1;

    for(let i=2;i<=n;i++)
        result *= i;

    return result;
}


/* RECIPROCAL */

function reciprocal(){

    let x = currentValue();

    if(x === null || x === 0){
        showError();
        return;
    }

    answer = 1/x;
    expression = "";

    update();
}


function fraction(){
    reciprocal();
}


/* PERCENT */

function percentFunction(){

    let x = currentValue();

    if(x === null) return;

    answer = x/100;
    expression = "";

    update();
}


/* MEMORY */

function memoryClear(){
    memory = 0;
    update();
}


function memoryRecall(){

    expression += String(memory);
    update();
}


function memoryPlus(){

    let x = currentValue();

    if(x === null) return;

    memory += x;
    expression = "";

    update();
}


function memoryMinus(){

    let x = currentValue();

    if(x === null) return;

    memory -= x;
    expression = "";

    update();
}


function memoryStore(){

    let x = currentValue();

    if(x === null) return;

    memory = x;
    update();
}


/* ABS */

function absoluteFunction(){

    let x = currentValue();

    if(x === null) return;

    answer = Math.abs(x);
    expression = "";

    update();
}


/* RANDOM */

function randomFunction(){

    answer = Math.random();
    expression = "";

    update();
}


/* SCIENTIFIC NOTATION */

function scientificNotation(){

    insert("×10^");
}


/* SHIFT */

function toggleShift(){

    shift = !shift;
    update();
}


function toggleAlpha(){

    alpha = !alpha;
    update();
}


/* POWER ON */

function powerOn(){

    expression = "";
    answer = 0;

    update();
}


/* ANGLE */

function showAngle(){

    showPopup("ANGLE MODE");

}


function setAngle(mode){

    angleMode = mode;

    closePopup();
    update();
}


/* HISTORY */

function showHistory(){

    if(history.length === 0){
        alert("No calculation history.");
        return;
    }

    alert(
        history.slice(-10).join("\n")
    );
}


/* MENU */

function showMenu(){
    showPopup("MENU");
}


function showSetup(){
    showPopup("SETUP");
}


function showPopup(title){

    document.getElementById("popupTitle").textContent =
        title;

    document.getElementById("popup").classList.add("show");
}


function closePopup(){

    document.getElementById("popup").classList.remove("show");
}


/* MODES */

function matrixMode(){
    alert("MATRIX mode selected.");
}

function vectorMode(){
    alert("VECTOR mode selected.");
}

function statMode(){
    alert("STAT mode selected.");
}

function complexMode(){
    alert("CMPLX mode selected.");
}

function baseMode(){
    alert("BASE mode selected.");
}

function constantMenu(){

    alert(
        "π = " + Math.PI +
        "\ne = " + Math.E
    );
}


/* ERROR */

function showError(){

    document.getElementById("answer").textContent =
        "Math ERROR";

    setTimeout(update,1200);
}


/* FORMAT */

function format(x){

    if(
        x === undefined ||
        x === null ||
        Number.isNaN(x)
    )
        return "0";

    if(
        Math.abs(x) >= 10000000000 ||
        (
            Math.abs(x) > 0 &&
            Math.abs(x) < 0.00000001
        )
    ){
        return Number(x).toExponential(8);
    }

    return Number(x.toFixed(10)).toString();
}


/* KEYBOARD */

document.addEventListener("keydown",function(event){

    let key = event.key;

    if(
        (key >= "0" && key <= "9") ||
        key === "." ||
        key === "+" ||
        key === "-" ||
        key === "*" ||
        key === "/" ||
        key === "(" ||
        key === ")"
    ){

        insert(
            key === "*" ? "×" :
            key === "/" ? "÷" :
            key
        );

    }
    else if(key === "Enter"){

        event.preventDefault();
        calculate();

    }
    else if(key === "Backspace"){

        deleteLast();

    }
    else if(key === "Escape"){

        allClear();

    }
});


/* START */

update();

</script>

</body>
    </html>
