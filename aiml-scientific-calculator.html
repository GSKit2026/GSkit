<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GSKit Scientific Calculator</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;display:flex;align-items:center;
 justify-content:center;padding:15px;background:#18242d;
 font-family:Arial,sans-serif;color:white
}
.calculator{
 width:100%;max-width:390px;padding:18px;
 background:#34343d;border-radius:25px;
 box-shadow:0 12px 30px #0008
}
.brand{font-size:23px;font-weight:bold;margin-bottom:12px}
.brand small{display:block;font-size:11px;color:#ddd;margin-top:4px}
.screen{
 background:#dce6d9;color:#17221a;padding:12px;
 border:6px solid #191a1f;border-radius:10px;
 text-align:right;min-height:100px;margin-bottom:15px;
 overflow-wrap:anywhere
}
#mode{font-size:11px}
#expression{font-size:20px;min-height:28px;margin-top:5px}
#answer{font-size:25px;font-weight:bold;min-height:30px}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
button{
 min-width:0;min-height:47px;border:0;border-radius:8px;
 background:#45454f;color:white;font-size:15px;font-weight:bold;
 box-shadow:0 3px 0 #19191e;cursor:pointer
}
button:active{transform:translateY(2px)}
.fn{color:#f2dc73}
.num{background:#90919a;font-size:20px}
.op{background:#62626c;font-size:20px}
.eq,.clear{background:#c6e65b;color:#1b2410}
@media(max-width:350px){.calculator{padding:11px}.keys{gap:5px}button{min-height:42px;font-size:13px}}
</style>
</head>
<body>
<main class="calculator">
 <div class="brand">CASIO
  <small>fx-991ES PLUS STYLE • GSKit</small>
 </div>
 <div class="screen">
  <div id="mode">DEG • COMP</div>
  <div id="expression">0</div>
  <div id="answer">0</div>
 </div>
 <div class="keys">
  <button class="fn" onclick="angleMode=angleMode==='DEG'?'RAD':'DEG';updateMode()">DEG/RAD</button>
  <button class="fn" onclick="put('sin(')">sin</button>
  <button class="fn" onclick="put('cos(')">cos</button>
  <button class="fn" onclick="put('tan(')">tan</button>
  <button class="fn" onclick="put('log(')">log</button>

  <button class="fn" onclick="put('asin(')">sin⁻¹</button>
  <button class="fn" onclick="put('acos(')">cos⁻¹</button>
  <button class="fn" onclick="put('atan(')">tan⁻¹</button>
  <button class="fn" onclick="put('ln(')">ln</button>
  <button class="fn" onclick="put('sqrt(')">√</button>

  <button class="fn" onclick="put('(')">(</button>
  <button class="fn" onclick="put(')')">)</button>
  <button class="fn" onclick="put('^')">xʸ</button>
  <button class="fn" onclick="put('^2')">x²</button>
  <button class="fn" onclick="put('!')">x!</button>

  <button class="num" onclick="put('7')">7</button>
  <button class="num" onclick="put('8')">8</button>
  <button class="num" onclick="put('9')">9</button>
  <button class="op" onclick="put('/')">÷</button>
  <button class="clear" onclick="del()">DEL</button>

  <button class="num" onclick="put('4')">4</button>
  <button class="num" onclick="put('5')">5</button>
  <button class="num" onclick="put('6')">6</button>
  <button class="op" onclick="put('*')">×</button>
  <button class="op" onclick="put('-')">−</button>

  <button class="num" onclick="put('1')">1</button>
  <button class="num" onclick="put('2')">2</button>
  <button class="num" onclick="put('3')">3</button>
  <button class="op" onclick="put('+')">+</button>
  <button class="eq" onclick="calculate()">=</button>

  <button class="num" onclick="put('0')">0</button>
  <button class="num" onclick="put('.')">.</button>
  <button class="fn" onclick="put('pi')">π</button>
  <button class="fn" onclick="put('e')">e</button>
  <button class="clear" onclick="clearAll()">AC</button>

  <button class="fn" onclick="put('%')">%</button>
  <button class="fn" onclick="put('Ans')">Ans</button>
  <button class="fn" onclick="put('abs(')">Abs</button>
  <button class="fn" onclick="put('^(-1)')">x⁻¹</button>
  <button class="fn" onclick="put('*10^')">×10ˣ</button>
 </div>
</main>

<script>
"use strict";
let expression="";
let lastAnswer=0;
let angleMode="DEG";

const expEl=document.getElementById("expression");
const ansEl=document.getElementById("answer");

function updateMode(){
 document.getElementById("mode").textContent=angleMode+" • COMP";
}
function render(){
 expEl.textContent=expression||"0";
}
function put(value){
 if(expression==="Error") expression="";
 if(value==="Ans") value="("+String(lastAnswer)+")";
 expression+=value;
 render();
}
function clearAll(){
 expression="";
 ansEl.textContent="0";
 render();
}
function del(){
 if(expression==="Error") expression="";
 else expression=expression.slice(0,-1);
 render();
}
function factorial(n){
 if(!Number.isInteger(n)||n<0||n>170) throw Error("factorial");
 let r=1;
 for(let i=2;i<=n;i++) r*=i;
 return r;
}
function calculate(){
 try{
  let s=expression.replace(/\s/g,"");
  if(!s) throw Error("empty");

  s=s.replace(/π/g,"pi");
  s=s.replace(/×/g,"*").replace(/÷/g,"/");
  s=s.replace(/−/g,"-");

  // Convert factorial postfix to a parser function.
  s=s.replace(/(\d+(?:\.\d+)?|\([^()]*\))!/g,"fact($1)");
  s=s.replace(/(\d+(?:\.\d+)?)%/g,"($1/100)");

  const tokens=s.match(/(?:\d+(?:\.\d*)?|\.\d+|[A-Za-z]+|[()+\-*/^,])/g);
  if(!tokens||tokens.join("")!==s) throw Error("syntax");

  let p=0;
  const rad=x=>angleMode==="DEG"?x*Math.PI/180:x;
  const deg=x=>angleMode==="DEG"?x*180/Math.PI:x;
  const funcs={
   sin:x=>Math.sin(rad(x)),
   cos:x=>Math.cos(rad(x)),
   tan:x=>Math.tan(rad(x)),
   asin:x=>deg(Math.asin(x)),
   acos:x=>deg(Math.acos(x)),
   atan:x=>deg(Math.atan(x)),
   log:x=>Math.log10(x),
   ln:x=>Math.log(x),
   sqrt:x=>Math.sqrt(x),
   abs:x=>Math.abs(x),
   fact:factorial
  };
  const constants={pi:Math.PI,e:Math.E,Ans:lastAnswer};

  function eat(t){
   if(tokens[p]===t){p++;return true}
   return false;
  }
  function primary(){
   if(eat("+"))return primary();
   if(eat("-"))return -primary();
   if(eat("(")){
    let v=addSub();
    if(!eat(")"))throw Error("bracket");
    return v;
   }
   const t=tokens[p];
   if(t===undefined)throw Error("value");
   if(/^(?:\d|\.)/.test(t)){
    p++;return Number(t);
   }
   if(/^[A-Za-z]+$/.test(t)){
    p++;
    if(eat("(")){
     if(!Object.prototype.hasOwnProperty.call(funcs,t))throw Error("function");
     const v=addSub();
     if(!eat(")"))throw Error("bracket");
     return funcs[t](v);
    }
    if(Object.prototype.hasOwnProperty.call(constants,t))return constants[t];
    throw Error("constant");
   }
   throw Error("syntax");
  }
  function power(){
   let v=primary();
   if(eat("^"))v=Math.pow(v,power());
   return v;
  }
  function mulDiv(){
   let v=power();
   while(true){
    if(eat("*"))v*=power();
    else if(eat("/"))v/=power();
    else break;
   }
   return v;
  }
  function addSub(){
   let v=mulDiv();
   while(true){
    if(eat("+"))v+=mulDiv();
    else if(eat("-"))v-=mulDiv();
    else break;
   }
   return v;
  }

  const result=addSub();
  if(p!==tokens.length||!Number.isFinite(result))throw Error("result");
  lastAnswer=result;
  ansEl.textContent=Number(result.toPrecision(12)).toString();
  expression=String(result);
  render();
 }catch(error){
  ansEl.textContent="Error";
 }
}
updateMode();
render();
</script>
</body>
</html>
